[package]
name = "chemrealm-sci-core"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sci-core-host"
path = "src/main.rs"

[features]
default = []
wasm = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
