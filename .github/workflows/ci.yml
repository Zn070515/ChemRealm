name: CI

on:
  push:
  pull_request:

# Everything here is a hard gate. M0's acceptance is "CI is green on a clean
# checkout, and a deliberately-introduced forbidden import has been observed to
# fail the build" — which is why the guard steps are not marked continue-on-error.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- TypeScript toolchain -------------------------------------------
      # No pnpm `version:` input. The pnpm version lives in package.json's
      # `packageManager` field, and action-setup reads it from there. Naming it
      # in both places makes the action fail with "Multiple versions of pnpm
      # specified" — one version, one source of truth, the same rule the
      # project applies to every other contract.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The native backend is a candidate implementation, but its compilation
      # contract must be exercised on every clean checkout before it can ever
      # supersede the accepted TypeScript backend.
      - run: pnpm native:fmt
      - run: pnpm native:test
      - run: pnpm native:clippy
      - run: pnpm native:check-wasm
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - run: pnpm build
      # Host and release-WASM executions must agree byte-for-byte over the
      # canonical reference/adversarial request matrix before native can ever
      # supersede the accepted TypeScript backend.
      - run: pnpm verify:native-differential
      - run: pnpm test

      # Type-level guarantees (AC-U1..AC-U5). These CANNOT be runtime tests:
      # m0 = 1 mol/kg makes reduced and physical molality numerically identical,
      # so a passing numeric assertion says nothing about whether the types are
      # respected. `tsc --noEmit` over the fixture file fails on an unused
      # @ts-expect-error, which is exactly what a broken guarantee produces.
      - run: pnpm verify:guarantees

      # The committed JSON Schema artifacts must match a fresh emission, so the
      # Python side never validates against a stale contract.
      - run: pnpm verify:schema-artifacts
      # All current package, schema, scientific, native, toolchain, and oracle
      # versions are distributed from contracts/version-manifest.json. This is
      # a drift gate, not a convention.
      - run: pnpm verify:versions
      # Native bridge DTOs are mechanically checked against the committed
      # schema artifacts, and native/governance docs are checked against the
      # same centralized version manifest.
      - run: pnpm verify:native-schema
      - run: pnpm verify:native-governance
      - run: pnpm verify:native-evidence

      # Architectural rules, plus the guard that proves they bite. The guard is
      # what makes M0's stop condition machine-checked rather than a claim.
      - run: pnpm depcruise
      - run: pnpm guards
      - run: pnpm verify:scientific-math
      - run: pnpm verify:scientific-quantities
      - run: pnpm verify:m4-contracts
      - run: pnpm verify:m5-contracts
      - run: pnpm verify:world

      # Product properties asserted against the shipped artifact: no
      # third-party origin (AC-P5), no server API route (AC-P1).
      - run: pnpm artifacts

      # AC-P5's actual acceptance evidence. The artifact scan above is a static
      # guard; this loads the built page in a real browser and captures every
      # request, which is what the spec's "network inspection" asks for. A URL
      # assembled at runtime is invisible to a regex and caught here.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

      - run: pnpm lint

      # --- Python toolchain -----------------------------------------------
      # Commands here are identical to CLAUDE.md 21.5 and README.md. They are
      # platform-neutral on purpose: the Windows-only `py` launcher does not
      # exist on this runner.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run pytest

      # M4's scientific oracle is a hard gate: the pinned PHREEQC source is
      # built from the checked-in manifest before the cross-engine sweep.
      - run: bash tools/oracle/phreeqc/install_ci.sh
      - name: Run M4 reference and PHREEQC cross-engine validation
        env:
          CHEMREALM_REQUIRE_PHREEQC: "1"
        run: uv run python tools/oracle/reference/run_m4_validation.py

      # Acceptance-criterion coverage: every AC defined in SPEC-0001 must be
      # claimed by a PLAN-0001 milestone AND carry evidence there.
      - run: uv run python tools/check_acceptance_coverage.py
