<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" data-coordinate-space="logical-artboard" role="img" aria-labelledby="title desc">
  <title id="title">ChemRealm reusable apparatus construction sheet</title>
  <desc id="desc">Original orthographic construction sheet showing burette, flask, beaker, graduated cylinder, volumetric flask, test tube, detachable glass and rubber connectors, and stopper variants.</desc>
  <defs>
