      <stop offset=".5" stop-color="#4b5a5c"/>
      <stop offset="1" stop-color="#11181b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#21353b"/>
      <stop offset="1" stop-color="#38565d"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9db2b8" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
