<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 900" data-asset-id="burette-alkali-50ml-class-b" data-family-id="burette" data-capacity-ml="50" data-coordinate-unit="mm" data-master-authored="true" data-marking-kind="burette-approximate" role="img" aria-labelledby="title desc" data-lod="master" data-lod-detail="full" data-lod-visible-roles="body|glass-back|glass-front|rim|scale|labels|lower-connector|rubber-tube|glass-bead|pinch-region|tip|highlight" data-dimensions-mm="36 900 36" data-body-dimensions-mm="18 830 18" data-asset-version="2.0.0">
